# file: last-round-backend/src/main/resources/application-mysql.yml
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:last-round-db.cn8wyyom2524.ap-northeast-2.rds.amazonaws.com}:${DB_PORT:3306}/${DB_NAME:last_round}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
